
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | DriverMatchr</title>

    <link rel="stylesheet" href="./driver-login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <span>Driver</span>Matchr
            </div>

            <p class="welcome">Welcome Back, Customer</p>

            <p class="subtitle">
                Login to find trusted drivers and start your journey.
            </p>

            <form>

                <div class="input-group">
                    <label for="email">Email or Mobile Number</label>

                    <input type="text"
                        id="email"
                        placeholder="Enter your email or mobile number">
                </div>


                <div class="input-group">
                    <label for="password">Password</label>

                    <input type="password"
                        id="password"
                        placeholder="Enter your password">
                </div>


                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="register">
                Don't have a DriverMatchr account?
                <a href="#">Register as Customer</a>
            </p>


            <a href="customer.html" class="back-link">
                ← Back to Customer Page
            </a>

        </div>

    </div>

</body>

</html>
