<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Login | DriverMatchr</title>

    <link rel="stylesheet" href="driver-login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <span>Driver</span>Matchr
            </div>

            <p class="welcome">Welcome Back, Driver</p>

            <p class="subtitle">
                Login to connect with customers and start your journey.
            </p>

            <form>

                <div class="input-group">
                    <label for="email">Email or Mobile Number</label>
                    <input type="text" id="email"
                        placeholder="Enter your email or mobile number">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Enter your password">
                </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">Login</button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="register">
                Don't have a DriverMatchr account?
                <a href="#">Register as Driver</a>
            </p>

            <a href="driver.html" class="back-link">
                ← Back to Driver Page
            </a>

        </div>

    </div>

</body>

</html>
